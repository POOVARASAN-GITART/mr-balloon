# Mr Balloon Supabase Local Config
# See: https://supabase.com/docs/guides/local-development/config

[db]
port = 54322

[studio]
port = 54323

[inbucket]
port = 54324

[api]
port = 54321

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true



[auth.email]
enable_signup = true

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"